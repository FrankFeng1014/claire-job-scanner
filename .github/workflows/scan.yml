name: 每日招聘扫描

on:
  schedule:
    # 每天两次：UTC 11:23 和 23:23（多伦多冬令时早上 6:23、晚上 6:23；夏令时各晚 1 小时）。
    # GitHub 的定时任务繁忙时可能推迟，分钟数避开整点。
    - cron: "23 11,23 * * *"
  workflow_dispatch:
    inputs:
      discover:
        description: "先运行招聘系统自动识别（discover --apply；平时每周自动跑一次）"
        type: boolean
        default: false
      test_email:
        description: "只发一封测试邮件（不扫描）"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  test_email:
    if: ${{ inputs.test_email }}
    runs-on: ubuntu-latest
    steps:
      - name: 发送测试邮件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "测试邮件（$(date -u +%F)）" \
            --body "@${{ github.repository_owner }} 这是一封测试通知。收到这封邮件，说明以后有新岗位时你也能收到邮件。可以直接关闭这条 Issue。"

  scan:
    if: ${{ !inputs.test_email }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # 无界面浏览器（Chromium）：用来打开靠脚本加载职位的招聘页。缓存起来，下次不用重新下载。
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: 安装浏览器
        run: python -m playwright install --with-deps chromium || echo "浏览器安装失败，本次按普通方式读取网页"

      # 测试不通过，后面所有步骤都不会执行，不会改动任何数据
      - name: 测试
        run: python -m pytest -q

      - name: 识别招聘系统（每 7 天一次，或手动勾选）
        run: |
          last=$(cat data/discover_last.txt 2>/dev/null || echo 0)
          now=$(date -u +%s)
          if [ "${{ inputs.discover }}" = "true" ] || [ $((now - last)) -ge 590000 ]; then
            python -m scanner.discover --apply && echo "$now" > data/discover_last.txt
          else
            echo "距上次识别不到 7 天，跳过"
          fi

      - name: 扫描全部雇主 + 外部招聘渠道
        id: scan
        env:
          # 可选：在仓库 Settings → Secrets and variables → Actions 里添加，就会多读 Adzuna 渠道
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python -m scanner.main scan

      # 提交和通知相互独立：任一步失败都不影响另一步
      - name: 提交结果（冲突时自动重试）
        id: commit
        if: ${{ steps.scan.outcome == 'success' }}
        continue-on-error: true
        run: |
          git config user.name "claire-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then echo "没有变化，不提交"; exit 0; fi
          git commit -m "scan $(date -u +%F) $(python -c "import json;print(json.load(open('data/latest.json'))['scan_id'])")"
          for i in 1 2 3; do
            if git push; then echo "提交成功"; exit 0; fi
            echo "推送失败，第 $i 次重试前先合并远端改动"
            git pull --rebase || { echo "::error::与远端改动冲突，已放弃本次提交（数据未丢失到错误状态）"; git rebase --abort; exit 1; }
            sleep 5
          done
          echo "::error::三次推送都失败，本次结果未保存到仓库"
          exit 1

      - name: 有可申请职位时发 Issue（同一天已有则追加评论，避免重复）
        id: notify
        if: ${{ steps.scan.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(python -c "import json;L=json.load(open('data/latest.json'));print(len(L.get('candidates', L['new_relevant'])))")
          k=$(python -c "import json;L=json.load(open('data/latest.json'));print(len(L['new_relevant']))")
          m=$(python -c "import json;print(len(json.load(open('data/latest.json')).get('new_employers',[])))")
          d=$(python -c "import json;print(json.load(open('data/latest.json'))['date'])")
          echo "可申请职位：$n（其中新发布 $k）  新加入名单的雇主：$m"
          if [ "$n" -eq 0 ] && [ "$m" -eq 0 ]; then exit 0; fi
          day=$(date -u +%F)
          full="https://github.com/${{ github.repository }}/blob/main/reports/$d.md"
          { echo "@${{ github.repository_owner }} 本次可申请的职位 $n 个（新发布 $k 个，其余为新接入雇主的现有职位），新加入名单的雇主 $m 家（$(TZ=America/Toronto date '+%H:%M') 多伦多时间）。按与 Claire 的匹配度排序。"
            echo; echo "完整清单（不截断）：$full"; echo
            head -c 60000 reports/latest.md
            echo; echo; echo "（内容较长时这里会被截断，请看上面的完整清单链接）"; } > /tmp/body.md
          existing=$(gh issue list --state all --search "\"$day\" in:title" --json number,title \
                     --jq "map(select((.title | contains(\"$day\")) and ((.title | contains(\"新岗位\")) or (.title | contains(\"可申请职位\"))))) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/body.md
            echo "今天已有 Issue #$existing，已追加评论"
          else
            gh issue create --title "可申请职位 $n 个（$day）" --body-file /tmp/body.md
          fi

      - name: 扫描出问题时发 Issue（扫描失败、保存失败、重点雇主突然读不到）
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          problem=""
          if [ "${{ steps.scan.outcome }}" != "success" ]; then problem="扫描没有成功完成（${{ steps.scan.outcome }}）。"; fi
          if [ "${{ steps.commit.outcome }}" = "failure" ]; then problem="$problem 扫描结果没有保存成功。"; fi
          nb=0
          if [ -f data/latest.json ] && [ "${{ steps.scan.outcome }}" = "success" ]; then
            nb=$(python -c "import json;print(len(json.load(open('data/latest.json')).get('newly_broken',[])))")
          fi
          if [ -z "$problem" ] && [ "$nb" = "0" ]; then echo "一切正常"; exit 0; fi
          day=$(date -u +%F)
          { echo "@${{ github.repository_owner }} ⚠️ 扫描出现问题，需要处理：$problem"
            echo
            if [ "$nb" != "0" ]; then
              echo "上次还能读取、这次读不到的重点雇主（P0/P1）："
              python -c "import json;[print('- %s %s：%s'%(b['tier'],b['name'],b['detail'])) for b in json.load(open('data/latest.json'))['newly_broken']]"
              echo
            fi
            echo "运行记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo; echo "把这个 Issue 的链接发给 Claude，就能据此排查修复。"; } > /tmp/problem.md
          existing=$(gh issue list --state open --search "\"扫描异常\" \"$day\" in:title" --json number,title \
                     --jq "map(select(.title | contains(\"$day\"))) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/problem.md
          else
            gh issue create --title "⚠️ 扫描异常（$day）" --body-file /tmp/problem.md
          fi

      - name: 运行摘要（便于排查）
        if: ${{ always() }}
        run: |
          echo "扫描：${{ steps.scan.outcome }}  提交：${{ steps.commit.outcome }}  通知：${{ steps.notify.outcome }}"
          if [ -f data/latest.json ]; then
            python -c "import json;L=json.load(open('data/latest.json'));print('scan_id',L.get('scan_id'));print('读取质量',L.get('scan_states'))"
          fi
          if [ "${{ steps.commit.outcome }}" = "failure" ]; then exit 1; fi
